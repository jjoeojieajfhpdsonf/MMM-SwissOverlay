<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MMM-SwissOverlay preview</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Roboto Condensed", system-ui, sans-serif; overflow: hidden; }
		.mirror { position: absolute; inset: 0; padding: 60px; box-sizing: border-box; }
		.clock { font-size: 64px; font-weight: 300; }
		.date { color: #999; font-size: 20px; }
		.compliment { position: absolute; left: 0; right: 0; top: 62%; text-align: center; font-size: 46px; font-weight: 200; }
		.controls { position: fixed; z-index: 10000; right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 32px);
			background: rgba(30, 30, 34, 0.85); padding: 10px; border-radius: 14px; font: 13px system-ui, sans-serif; }
		.controls select, .controls input { background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 6px 8px; }
	</style>
</head>
<body>
	<div class="mirror">
		<div class="date">Saturday, 1 August</div>
		<div class="clock">21:35</div>
		<div class="compliment">Have a nice evening!</div>
	</div>
	<div class="swiss-overlay" style="position:fixed;inset:0;pointer-events:none"><canvas style="width:100%;height:100%;display:block"></canvas></div>

	<div class="controls">
		<select id="occ"></select>
		<select id="style"><option value="graphics">graphics</option><option value="emoji">emoji</option></select>
		<select id="intensity"><option>low</option><option selected>medium</option><option>high</option></select>
		<input id="date" type="date" title="Show what this day looks like">
	</div>

	<script src="holidays.js"></script>
	<script src="occasions.js"></script>
	<script src="effects.js"></script>
	<script>
		// Lets you look at every occasion without a mirror: open this file in a browser.
		const overlay = new SwissOverlayEffects.Overlay(document.querySelector("canvas"));
		const occSel = document.getElementById("occ");
		occSel.append(new Option("(by date)", ""));
		for (const id of Object.keys(SwissOverlayOccasions.BUILTIN)) occSel.append(new Option(id, id));
		const params = new URLSearchParams(location.search);
		if (params.get("occasion")) occSel.value = params.get("occasion");
		if (params.get("style")) document.getElementById("style").value = params.get("style");

		function update() {
			const config = {
				style: document.getElementById("style").value,
				intensity: document.getElementById("intensity").value,
				forceOccasion: occSel.value || null,
				// the preview shows Bundesfeier fireworks at any time
				occasions: { bundesfeier: { fireworksHours: null } }
			};
			const d = document.getElementById("date").value;
			const now = d ? new Date(`${d}T21:00:00`) : new Date();
			const occ = SwissOverlayOccasions.pick(config, now);
			if (occ && occ.candles) {
				occ.candleCount = 0;
				for (let i = 1; i <= 4; i++) if (SwissOverlayDates.advent(now.getFullYear(), i) <= now) occ.candleCount = i;
				if (!occ.candleCount) occ.candleCount = 3;
			}
			overlay.show(occ);
		}
		for (const el of document.querySelectorAll(".controls select, .controls input")) el.addEventListener("change", update);
		if (params.get("hideControls")) document.querySelector(".controls").style.display = "none";
		update();
	</script>
</body>
</html>
